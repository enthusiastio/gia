services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gia
      POSTGRES_PASSWORD: gia_secret
      POSTGRES_DB: gia_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gia -d gia_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

